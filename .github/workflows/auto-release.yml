name: Auto Release

on:
  push:
    branches: [ "main" ]

jobs:
  bump-and-release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          CSPROJ=src/R3Async/R3Async.csproj
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "s#<Version>$CURRENT</Version>#<Version>$NEW_VERSION</Version>#" "$CSPROJ"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/R3Async/R3Async.csproj
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip release]"
          git push

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore ./src

      - name: Build
        run: dotnet build -c Release ./src --no-restore

      - name: Test
        run: dotnet test -c Release ./src/R3Async.Tests --no-build --verbosity normal

      - name: Pack nugets
        run: dotnet pack src/R3Async -c Release --no-build --output .

      - name: Push to NuGet
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.nuget_api_key }} --source https://api.nuget.org/v3/index.json

      # Note: this uses GITHUB_TOKEN, so the resulting "release: published" event does NOT
      # re-trigger release.yml (GitHub blocks workflow-triggered events from starting new
      # workflow runs to avoid recursion) — that's why publishing happens in this job directly.
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --target main
